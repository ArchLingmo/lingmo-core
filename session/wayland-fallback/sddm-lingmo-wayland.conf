# Lingmo (lingmo-core): before each X11 greeter, lists "Lingmo (Wayland)" only
# when the GPU driver can run it, and points the greeter back at Lingmo (X11)
# after a Wayland start that failed (/usr/lib/lingmo/lingmo-wayland-check).
# A DisplayCommand set in /etc/sddm.conf.d wins over this file; the Wayland
# session is then simply not listed (its TryExec= is created by the check).
[X11]
DisplayCommand=/usr/lib/lingmo/sddm-xsetup
