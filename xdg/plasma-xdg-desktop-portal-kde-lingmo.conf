# xdg-desktop-portal-kde only offers screen sharing (ScreenCast), screenshots,
# remote desktop, global shortcuts, input capture and the clipboard when
# XDG_CURRENT_DESKTOP is exactly "KDE" (desktopportal.cpp). In the Lingmo session it
# is "Lingmo", so browsers could only share their own tabs. KWin is the compositor
# here as in Plasma: this backend process alone is told it runs on KDE.
[Service]
Environment=XDG_CURRENT_DESKTOP=KDE
