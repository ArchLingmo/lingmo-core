# xdg-desktop-portal backends for XDG_CURRENT_DESKTOP=Lingmo (both sessions).
# KDE's backend (xdg-desktop-portal-kde) talks to KWin: screen sharing, screenshots,
# remote desktop/input capture (Deskflow), global shortcuts, file dialogs. GTK's
# covers what KDE's lacks.
[preferred]
default=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet;gnome-keyring;
